# VoxPilot POS — Coolify production compose.
# Coolify deploys this file. Domain: pos.voxpilothq.io
# Coolify handles TLS termination and reverse proxy.
#
# WebSocket proxy: /app/* and /apps/* go to Reverb (6001) through the Traefik labels on `pos`.
# See DEPLOYMENT_COOLIFY.md for proxy configuration.

services:
  pos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voxpilot-pos
    restart: unless-stopped
    depends_on:
      pos-redis:
        condition: service_healthy
    environment:
      APP_NAME: "VoxPilot POS"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://pos.voxpilothq.io}
      APP_KEY: ${APP_KEY}
      IGNITER_LOCATION_MODE: ${IGNITER_LOCATION_MODE:-multiple}
      DB_CONNECTION: mysql
      # External MySQL 8.4 on the database server (not on the apps server).
      DB_HOST: ${DB_HOST:?set DB_HOST to the database server}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-voxpilot_pos}
      DB_USERNAME: ${DB_USERNAME:-voxpilot_pos}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PREFIX: ti_
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: pos-redis
      REDIS_PORT: "6379"
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: ${REVERB_HOST:-pos.voxpilothq.io}
      REVERB_PORT: "443"
      REVERB_SCHEME: https
      REVERB_SERVER_HOST: "0.0.0.0"
      REVERB_SERVER_PORT: "6001"
      REVERB_SERVER_SCHEME: http
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@voxpilothq.io}
      MAIL_FROM_NAME: "VoxPilot POS"
      # Mail and the owner invite go through the database queue (queue-worker in supervisor).
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      # VoxPilot (SPEC-011). Secrets: same values as the VoxPilot backend's POS_PROVISIONING_SECRET /
      # POS_HMAC_SECRET, >= 32 chars; without the provisioning secret the VoxPilot endpoints answer 503.
      VOXPILOT_PROVISIONING_SECRET: ${VOXPILOT_PROVISIONING_SECRET:-}
      VOXPILOT_HMAC_SECRET: ${VOXPILOT_HMAC_SECRET:-}
      # Where "Connect with VoxPilot" sends the browser (VoxPilot app URL + /integrations/pos/install).
      VOXPILOT_APP_INSTALL_URL: ${VOXPILOT_APP_INSTALL_URL:-https://app.voxpilothq.io/integrations/pos/install}
      # E-mail a newly provisioned owner the set-password invite.
      VOXPILOT_SEND_OWNER_INVITE: ${VOXPILOT_SEND_OWNER_INVITE:-true}
    volumes:
      - pos_storage:/var/www/html/storage
      - pos_bootstrap_cache:/var/www/html/bootstrap/cache
    # Coolify's proxy (Traefik) owns the host's 80/443: publish nothing, route by domain.
    # Domain in Coolify: https://pos.voxpilothq.io:80 (web). Reverb (Pusher protocol, /app/* and
    # /apps/*) goes to 6001 through the labels below.
    expose:
      - "80"
      - "6001"
    labels:
      - traefik.enable=true
      # Literal host: Coolify escapes `$` in labels, so a ${POS_HOST} variable ends up in the rule as
      # text and the router never matches (websocket /app/* then falls through to Apache, 404).
      - traefik.http.routers.pos-reverb.rule=Host(`pos.voxpilothq.io`) && (PathPrefix(`/app/`) || PathPrefix(`/apps/`))
      - traefik.http.routers.pos-reverb.entrypoints=https
      - traefik.http.routers.pos-reverb.tls=true
      - traefik.http.routers.pos-reverb.tls.certresolver=letsencrypt
      - traefik.http.routers.pos-reverb.priority=1000
      - traefik.http.routers.pos-reverb.service=pos-reverb
      - traefik.http.services.pos-reverb.loadbalancer.server.port=6001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  pos-redis:
    image: redis:7-alpine
    container_name: voxpilot-pos-redis
    restart: unless-stopped
    volumes:
      - pos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pos_redis_data:
  pos_storage:
  pos_bootstrap_cache:
